<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cloth (Verlet + Constraints + Tear)</title>
  <style>
    html, body { margin:0; height:100%; background:#0b0f14; overflow:hidden; }
    canvas { display:block; width:100vw; height:100vh; }
    .hud{
      position:fixed; left:12px; top:12px; padding:10px 12px;
      font:13px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color:#d9e2f1; background:rgba(20,28,38,.55);
      border:1px solid rgba(255,255,255,.08); border-radius:10px;
      backdrop-filter: blur(6px);
      user-select:none; -webkit-user-select:none;
    }
    .hud b{ color:#fff; }
    .hud .row{ margin-top:6px; opacity:.9; }
    .hud .pill{
      display:inline-block; margin-left:6px; padding:2px 8px; border-radius:999px;
      background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.10);
      font-size:12px;
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div><b>Cloth Simulation</b> (Verlet + constraints)</div>
  <div class="row">Drag = pull cloth <span class="pill">LMB / touch</span></div>
  <div class="row">Tear while dragging = move fast / yank hard</div>
  <div class="row">Reset <span class="pill">R</span> · Toggle wind <span class="pill">W</span></div>
</div>

<script>
(() => {
  // ===== Canvas setup (HiDPI) =====
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    canvas.width  = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize, { passive: true });
  resize();

  // ===== Physics parameters (tuned for stability) =====
  const GRAVITY = 980;                 // px/s^2
  const SUBSTEPS = 6;                  // more = stiffer & stable, costs CPU
  const ITERATIONS = 10;               // constraint solve iterations per frame
  const DAMPING = 0.015;               // velocity damping in Verlet (0..1)
  const MAX_DT = 1/30;                 // clamp dt to avoid exploding after tab switch
  const MOUSE_INFLUENCE = 22;          // grab radius
  const TEAR_STRETCH = 2.2;            // break if length > TEAR_STRETCH * rest
  const EDGE_PADDING = 10;             // keep particles in bounds
  const PIN_MARGIN_TOP = 80;           // cloth hang height

  // Cloth size: adapt to screen
  function computeClothDims() {
    const spacing = Math.max(10, Math.min(18, Math.floor(Math.min(W, H) / 45)));
    const cols = Math.floor((Math.min(W * 0.78, 900)) / spacing);
    const rows = Math.floor((Math.min(H * 0.55, 520)) / spacing);
    return { spacing, cols: Math.max(20, cols), rows: Math.max(16, rows) };
  }

  // ===== Core types =====
  class Particle {
    constructor(x, y, pinned=false) {
      this.x = x; this.y = y;
      this.px = x; this.py = y;  // previous position for Verlet
      this.ax = 0; this.ay = 0;
      this.pinned = pinned;
      this.pinX = x; this.pinY = y;
      this.mass = 1;
    }
    addForce(fx, fy) { this.ax += fx; this.ay += fy; }
    integrate(dt) {
      if (this.pinned) {
        this.x = this.pinX; this.y = this.pinY;
        this.px = this.pinX; this.py = this.pinY;
        this.ax = 0; this.ay = 0;
        return;
      }
      // Verlet with damping (stable, simple)
      const vx = (this.x - this.px) * (1 - DAMPING);
      const vy = (this.y - this.py) * (1 - DAMPING);

      const nx = this.x + vx + this.ax * dt * dt;
      const ny = this.y + vy + this.ay * dt * dt;

      this.px = this.x; this.py = this.y;
      this.x = nx; this.y = ny;
      this.ax = 0; this.ay = 0;
    }
    constrainToBounds() {
      if (this.pinned) return;
      const minX = EDGE_PADDING, maxX = W - EDGE_PADDING;
      const minY = EDGE_PADDING, maxY = H - EDGE_PADDING;

      // If we clamp, also adjust previous position slightly to avoid energy injection
      if (this.x < minX) { this.x = minX; this.px = this.x; }
      else if (this.x > maxX) { this.x = maxX; this.px = this.x; }

      if (this.y < minY) { this.y = minY; this.py = this.y; }
      else if (this.y > maxY) { this.y = maxY; this.py = this.y; }
    }
  }

  class Constraint {
    constructor(p1, p2, rest) {
      this.p1 = p1; this.p2 = p2;
      this.rest = rest;
      this.broken = false;
    }
    solve() {
      if (this.broken) return;
      const p1 = this.p1, p2 = this.p2;
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const dist = Math.hypot(dx, dy) || 1e-9;

      // tear check (only if stretched far beyond rest)
      if (dist > this.rest * TEAR_STRETCH) {
        this.broken = true;
        return;
      }

      // positional correction
      const diff = (dist - this.rest) / dist;
      const inv1 = p1.pinned ? 0 : 1 / p1.mass;
      const inv2 = p2.pinned ? 0 : 1 / p2.mass;
      const invSum = inv1 + inv2;
      if (invSum === 0) return;

      // small compliance-like softness for stability
      const stiffness = 1.0;
      const corrX = dx * diff * stiffness;
      const corrY = dy * diff * stiffness;

      p1.x += corrX * (inv1 / invSum) * 0.5 * -1;
      p1.y += corrY * (inv1 / invSum) * 0.5 * -1;
      p2.x += corrX * (inv2 / invSum) * 0.5 *  1;
      p2.y += corrY * (inv2 / invSum) * 0.5 *  1;
    }
  }

  // ===== Cloth builder =====
  let particles = [];
  let constraints = [];
  let cloth = { cols: 0, rows: 0, spacing: 0, originX: 0, originY: 0 };

  function buildCloth() {
    particles.length = 0;
    constraints.length = 0;

    const { spacing, cols, rows } = computeClothDims();
    cloth.cols = cols;
    cloth.rows = rows;
    cloth.spacing = spacing;

    const width = cols * spacing;
    const height = rows * spacing;

    cloth.originX = Math.floor((W - width) * 0.5);
    cloth.originY = Math.floor(Math.min(PIN_MARGIN_TOP, H * 0.18));

    // Create grid
    const index = (x, y) => y * (cols + 1) + x;
    for (let y = 0; y <= rows; y++) {
      for (let x = 0; x <= cols; x++) {
        const px = cloth.originX + x * spacing;
        const py = cloth.originY + y * spacing;

        // pin the top row at intervals
        const pin = (y === 0) && (x % 3 === 0);
        particles.push(new Particle(px, py, pin));
      }
    }

    // Constraints: structural (horizontal & vertical) + a few shear (diagonal) for realism
    for (let y = 0; y <= rows; y++) {
      for (let x = 0; x <= cols; x++) {
        const p = particles[index(x, y)];
        if (x < cols) {
          const pR = particles[index(x + 1, y)];
          constraints.push(new Constraint(p, pR, spacing));
        }
        if (y < rows) {
          const pD = particles[index(x, y + 1)];
          constraints.push(new Constraint(p, pD, spacing));
        }
        // shear (diagonals)
        if (x < cols && y < rows) {
          const pDR = particles[index(x + 1, y + 1)];
          constraints.push(new Constraint(p, pDR, Math.hypot(spacing, spacing)));
        }
        if (x > 0 && y < rows) {
          const pDL = particles[index(x - 1, y + 1)];
          constraints.push(new Constraint(p, pDL, Math.hypot(spacing, spacing)));
        }
      }
    }
  }

  buildCloth();

  // ===== Mouse / touch interaction =====
  const pointer = {
    x: 0, y: 0,
    px: 0, py: 0,
    down: false,
    grabbed: null,
    justDown: false,
    tearing: false
  };

  function setPointerPos(clientX, clientY) {
    pointer.px = pointer.x; pointer.py = pointer.y;
    pointer.x = clientX;
    pointer.y = clientY;
  }

  function nearestParticle(x, y, radius) {
    const r2 = radius * radius;
    let best = null;
    let bestD2 = r2;
    for (const p of particles) {
      const dx = p.x - x, dy = p.y - y;
      const d2 = dx*dx + dy*dy;
      if (d2 < bestD2) { bestD2 = d2; best = p; }
    }
    return best;
  }

  function onDown(x, y) {
    pointer.down = true;
    pointer.justDown = true;
    setPointerPos(x, y);
    pointer.grabbed = nearestParticle(x, y, MOUSE_INFLUENCE);
    // If you grab a pinned point, allow dragging anyway (it’ll unpin temporarily)
    if (pointer.grabbed) {
      pointer.grabbed._wasPinned = pointer.grabbed.pinned;
      pointer.grabbed.pinned = false;
    }
  }

  function onMove(x, y) {
    setPointerPos(x, y);
  }

  function onUp() {
    pointer.down = false;
    pointer.justDown = false;
    pointer.tearing = false;
    if (pointer.grabbed) {
      // restore pin if it was pinned
      if (pointer.grabbed._wasPinned) {
        pointer.grabbed.pinned = true;
        pointer.grabbed.pinX = pointer.grabbed.x;
        pointer.grabbed.pinY = pointer.grabbed.y;
      }
      pointer.grabbed._wasPinned = false;
    }
    pointer.grabbed = null;
  }

  // Mouse
  window.addEventListener("mousedown", (e) => onDown(e.clientX, e.clientY));
  window.addEventListener("mousemove", (e) => onMove(e.clientX, e.clientY));
  window.addEventListener("mouseup", onUp);
  window.addEventListener("mouseleave", onUp);

  // Touch (prevent scroll)
  window.addEventListener("touchstart", (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    onDown(t.clientX, t.clientY);
  }, { passive:false });
  window.addEventListener("touchmove", (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    onMove(t.clientX, t.clientY);
  }, { passive:false });
  window.addEventListener("touchend", (e) => {
    e.preventDefault();
    onUp();
  }, { passive:false });
  window.addEventListener("touchcancel", onUp, { passive:true });

  // Keyboard
  let windOn = true;
  window.addEventListener("keydown", (e) => {
    if (e.key === "r" || e.key === "R") buildCloth();
    if (e.key === "w" || e.key === "W") windOn = !windOn;
  });

  // ===== Wind field (gentle, bounded) =====
  function windForce(t, x, y) {
    if (!windOn) return { fx: 0, fy: 0 };
    // smooth pseudo-wind: changes over time and across space
    const s = 0.0018;
    const a = Math.sin(t*0.7 + x*s) + 0.5*Math.sin(t*1.3 + y*s*1.7);
    const b = Math.cos(t*0.9 + y*s*1.2);
    const fx = 30 * a;
    const fy = 10 * b;
    return { fx, fy };
  }

  // ===== Tear mechanic while dragging =====
  function tryTearNearPointer(strength) {
    // strength derived from pointer speed; if strong enough, break nearby constraints
    // break only a few per frame to keep it sane
    const tearRadius = 28;
    const tearR2 = tearRadius * tearRadius;
    let breaks = 0;
    for (const c of constraints) {
      if (c.broken) continue;
      const mx = (c.p1.x + c.p2.x) * 0.5;
      const my = (c.p1.y + c.p2.y) * 0.5;
      const dx = mx - pointer.x;
      const dy = my - pointer.y;
      const d2 = dx*dx + dy*dy;
      if (d2 < tearR2) {
        // probabilistic-ish: stronger yank = more breaks
        if (strength > 1200 || Math.random() < Math.min(0.7, (strength - 700) / 900)) {
          c.broken = true;
          breaks++;
          if (breaks >= 5) break;
        }
      }
    }
  }

  // ===== Main loop =====
  let last = performance.now() / 1000;
  function frame() {
    const now = performance.now() / 1000;
    let dt = now - last;
    last = now;
    dt = Math.min(dt, MAX_DT);

    const subDt = dt / SUBSTEPS;

    for (let s = 0; s < SUBSTEPS; s++) {
      const t = now + s * subDt;

      // Apply forces
      for (const p of particles) {
        p.addForce(0, GRAVITY * p.mass);

        const w = windForce(t, p.x, p.y);
        p.addForce(w.fx, w.fy);

        // simple air resistance via damping already in integrator
      }

      // Pointer interaction
      if (pointer.down && pointer.grabbed) {
        // Pull grabbed particle toward pointer (soft constraint, avoids insta-teleport jitter)
        const g = pointer.grabbed;
        const dx = pointer.x - g.x;
        const dy = pointer.y - g.y;
        // Strong but stable: move partway per substep
        g.x += dx * 0.35;
        g.y += dy * 0.35;

        // Tear if yanked fast
        const vx = (pointer.x - pointer.px) / Math.max(1e-6, subDt);
        const vy = (pointer.y - pointer.py) / Math.max(1e-6, subDt);
        const speed = Math.hypot(vx, vy);

        if (speed > 700) {
          pointer.tearing = true;
          tryTearNearPointer(speed);
        } else {
          pointer.tearing = false;
        }
      }

      // Integrate
      for (const p of particles) p.integrate(subDt);

      // Solve constraints multiple iterations (stability!)
      for (let k = 0; k < ITERATIONS; k++) {
        for (const c of constraints) c.solve();
        for (const p of particles) p.constrainToBounds();
      }
    }

    render();
    requestAnimationFrame(frame);
  }

  // ===== Rendering =====
  function render() {
    // background
    ctx.fillStyle = "#0b0f14";
    ctx.fillRect(0, 0, W, H);

    // draw constraints as threads
    ctx.lineWidth = 1;
    ctx.globalAlpha = 1;

    // subtle gradient-ish by y (fake)
    for (const c of constraints) {
      if (c.broken) continue;
      const p1 = c.p1, p2 = c.p2;
      const dy = (p1.y + p2.y) * 0.5;
      const shade = Math.max(0, Math.min(1, (dy - cloth.originY) / (cloth.rows * cloth.spacing)));
      // no fancy styles: just compute a color value
      const base = 190 - Math.floor(60 * shade);
      ctx.strokeStyle = `rgb(${base},${base+10},${base+25})`;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    }

    // optional: highlight grabbed + tear zone
    if (pointer.down) {
      ctx.globalAlpha = 0.25;
      ctx.fillStyle = pointer.tearing ? "#ff4d4d" : "#7cc0ff";
      ctx.beginPath();
      ctx.arc(pointer.x, pointer.y, pointer.tearing ? 18 : 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // draw pins
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    for (const p of particles) {
      if (!p.pinned) continue;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
